   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="23.597813" transform="rotate(-0 6.7716 23.597813)">Many workers. One writer. A durable memory.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="6.7716" y="42.118594" transform="rotate(-0 6.7716 42.118594)">SQLite on one machine  /  claiming work and saving results are separate operations</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5fd5" x="6.7716" y="73.617891" transform="rotate(-0 6.7716 73.617891)">A  CLAIM THE WORK</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="69.9732" y="107.313891" transform="rotate(-0 69.9732 107.313891)">PENDING</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="225.72" y="107.313891" transform="rotate(-0 225.72 107.313891)">RUNNING</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="381.4668" y="107.313891" transform="rotate(-0 381.4668 107.313891)">COMPLETE</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="139.204301" transform="rotate(-0 6.7716 139.204301)">Conditional UPDATE: only a pending item can be claimed.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="153.460301" transform="rotate(-0 6.7716 153.460301)">Heartbeat renews a 3 h lease every 5 min; stale work returns to pending.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0f766e" x="6.7716" y="179.025891" transform="rotate(-0 6.7716 179.025891)">B  SERIALIZE THE WRITES</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="47.4012" y="219.28834" transform="rotate(-0 47.4012 219.28834)">worker 1</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="47.4012" y="238.72834" transform="rotate(-0 47.4012 238.72834)">worker 2</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="47.4012" y="258.16834" transform="rotate(-0 47.4012 258.16834)">worker 3</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f766e" x="180.576" y="235.617891" transform="rotate(-0 180.576 235.617891)">ONE WRITER</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="180.576" y="250.098398" transform="rotate(-0 180.576 250.098398)">short transactions</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="314.65368" y="235.618242" transform="rotate(-0 314.65368 235.618242)">SQLite + WAL</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="314.65368" y="250.098398" transform="rotate(-0 314.65368 250.098398)">committed results</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="409.45608" y="235.488008" transform="rotate(-0 409.45608 235.488008)">UI / CLI</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2a37" x="409.45608" y="250.098398" transform="rotate(-0 409.45608 250.098398)">readers</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="281.71234" transform="rotate(-0 6.7716 281.71234)">Busy writer? Wait up to 30 s; retry with backoff and jitter (10 attempts total).</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="299.121891" transform="rotate(-0 6.7716 299.121891)">C  KEEP TWO KINDS OF MEMORY</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="13.5432" y="327.124301" transform="rotate(-0 13.5432 327.124301)">batch_jobs → batch_items</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="13.5432" y="340.818398" transform="rotate(-0 13.5432 340.818398)">queue state · owner · lease · progress</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="239.2632" y="327.124301" transform="rotate(-0 239.2632 327.124301)">analysis_runs → analysis_results</text>
   </g>
   <g id="text_24">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="239.2632" y="340.818398" transform="rotate(-0 239.2632 340.818398)">run config · year · validated answer</text>
   </g>
   <g id="text_25">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="376.75234" transform="rotate(-0 6.7716 376.75234)">Per-year checkpoints reduce repeated work. A unique index rejects duplicate rows.</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="391.87234" transform="rotate(-0 6.7716 391.87234)">SQLite backup API keeps five copies. Leases are not an exactly-once guarantee.</text>
   </g>
   <g id="text_27">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="6.7716" y="414.717891" transform="rotate(-0 6.7716 414.717891)">Source: repository.py, migrations v001–v014, batch_queue.py. WAL lets reads overlap writes.</text>
   </g>
  </g>
 </g>
