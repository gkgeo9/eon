   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="23.152383" transform="rotate(-0 6.7716 23.152383)">Eight ways a fluent model went wrong</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="6.7716" y="41.832246" transform="rotate(-0 6.7716 41.832246)">Measured in the project's own outputs, 2025–2026</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="20.3148" y="93.132625" transform="rotate(-0 20.3148 93.132625)">99.8%</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 80.422356)">of May 2025 analyses</text>
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 91.994891)">dated themselves 2024</text>
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 101.960394)">(1,916 of 1,919)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="241.5204" y="93.132625" transform="rotate(-0 241.5204 93.132625)">91</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 85.755069)">options ideas with expiry</text>
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 96.524087)">dates already in the past</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="20.3148" y="158.796625" transform="rotate(-0 20.3148 158.796625)">24%</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 151.52067)">of all 'compounder' scores</text>
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 162.200705)">were exactly 68</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="241.5204" y="158.796625" transform="rotate(-0 241.5204 158.796625)">62%</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 151.470866)">of companies given a put bias;</text>
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 162.239884)">only 2% a call bias</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="20.3148" y="224.460625" transform="rotate(-0 20.3148 224.460625)">51%</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 217.979553)">of three-lens verdicts</text>
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 228.749236)">were HOLD</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="241.5204" y="224.460625" transform="rotate(-0 241.5204 224.460625)">~130</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 217.134866)">spellings of six 'success</text>
    <text style="font-size: 8.5px; font-family: 'Arial', 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 228.748572)">factors' before schemas</text>
   </g>
   <g id="text_15">
