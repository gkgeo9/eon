   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a37" x="6.7716" y="23.597813" transform="rotate(-0 6.7716 23.597813)">Eight ways a fluent model went wrong</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="6.7716" y="42.118594" transform="rotate(-0 6.7716 42.118594)">Measured in the project's own outputs, 2025–2026</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e8a33d" x="20.3148" y="119.10425" transform="rotate(-0 20.3148 119.10425)">99.8%</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 111.555969)">of May 2025 analyses dated</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 123.354367)">themselves 2024 (1,916 of 1,919)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e8a33d" x="241.5204" y="119.10425" transform="rotate(-0 241.5204 119.10425)">91</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 111.555969)">options ideas with expiry</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 123.030969)">dates already in the past</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5fd5" x="20.3148" y="203.92025" transform="rotate(-0 20.3148 203.92025)">24%</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 196.371969)">of all 'compounder' scores</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 207.846969)">were exactly 68</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e0605a" x="241.5204" y="203.92025" transform="rotate(-0 241.5204 203.92025)">62%</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 196.371969)">of companies given a put bias;</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 207.846969)">only 2% a call bias</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="20.3148" y="288.73625" transform="rotate(-0 20.3148 288.73625)">51%</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 282.011406)">of three-lens verdicts</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 293.411367)">were HOLD</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c5fd5" x="241.5204" y="288.73625" transform="rotate(-0 241.5204 288.73625)">~130</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 281.187969)">spellings of six 'success</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 293.486406)">factors' before schemas</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="20.3148" y="373.55225" transform="rotate(-0 20.3148 373.55225)">462</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 366.003969)">verdicts that opened with a</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(83.5164 378.302406)">label instead of the answer</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e0605a" x="241.5204" y="373.55225" transform="rotate(-0 241.5204 373.55225)">100%</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 366.003969)">of great companies credited</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #1f2a37" transform="translate(304.722 378.302406)">with 'continuous innovation'</text>
   </g>
